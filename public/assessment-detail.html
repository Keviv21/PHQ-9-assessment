<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Assessment details | OpenMind</title>
  <link rel="stylesheet" href="/assessment-detail.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/clinic.html" aria-label="OpenMind assessments home"><img src="/openmind-mark.svg" alt=""><span>OpenMind</span></a>
    <nav aria-label="Assessment navigation"><a href="/clinic.html">Patient Assessments &amp; Tests</a></nav>
  </header>
  <main class="detail-shell">
    <a id="back-link" class="back-link" href="/clinic.html"><span aria-hidden="true">←</span> Back to assessments</a>
    <div id="detail-status" class="detail-status" role="status" aria-live="polite">Loading assessment details…</div>
    <div id="detail-content" hidden>
      <div class="detail-layout">
        <div class="detail-main">
          <p class="eyebrow">ASSESSMENT LIBRARY</p>
          <h1 id="assessment-title"></h1>
          <p id="assessment-description" class="lead"></p>
          <div id="assessment-facts" class="facts" aria-label="Assessment facts"></div>
          <div id="assessment-categories" class="categories"></div>
          <div class="tabs" role="tablist" aria-label="Assessment information">
            <button id="tab-overview" class="tab active" type="button" role="tab" aria-selected="true" aria-controls="detail-tab-panel" data-tab="overview">Overview</button>
            <button id="tab-scoring" class="tab" type="button" role="tab" aria-selected="false" aria-controls="detail-tab-panel" data-tab="scoring">Scoring &amp; interpretation</button>
            <button id="tab-psychometrics" class="tab" type="button" role="tab" aria-selected="false" aria-controls="detail-tab-panel" data-tab="psychometrics">Psychometrics</button>
            <button id="tab-references" class="tab" type="button" role="tab" aria-selected="false" aria-controls="detail-tab-panel" data-tab="references">References</button>
          </div>
          <section id="detail-tab-panel" class="tab-panel" role="tabpanel" aria-labelledby="tab-overview"></section>
        </div>
        <aside class="detail-aside" aria-label="Questionnaire and assignment">
          <div class="preview-card"><div class="preview-heading"><span class="preview-mark">OM</span><span>QUESTIONNAIRE PREVIEW</span></div><h2 id="preview-title"></h2><div id="preview-questions"></div></div>
          <div class="report-preview"><h2>Report structure</h2><p>Score components included in the supplied definition</p><div id="preview-metrics"></div></div>
          <div class="aside-actions"><a id="select-assessment" class="select-button" href="/clinic.html">Select for final review <span aria-hidden="true">→</span></a><p>Return to the patient's assessment plan to confirm the assignment.</p></div>
        </aside>
      </div>
    </div>
  </main>
  <script type="module" src="/assessment-detail.js"></script>
</body>
</html>
